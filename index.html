<!doctype html>
<html lang="pt-BR" data-modo="dark" data-tema="fogo">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover para o app respeitar o notch quando instalado -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="description" content="Registre faltas por disciplina, veja o risco de reprovação por frequência e compare presença com a turma — sem expor os números de ninguém." />
    <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fffbf5" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <!--
      PNG, e não o SVG: o iOS ignora SVG em apple-touch-icon. Com só o SVG,
      "Adicionar à Tela de Início" no iPhone usava um print da página no lugar
      do ícone. O arquivo é gerado por `npm run icones`.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Nome sob o ícone na tela de início. Sem isto o iOS usa o <title>
         inteiro, que não cabe e vira "Controle de Fal...". -->
    <meta name="apple-mobile-web-app-title" content="Faltas" />
    <meta name="application-name" content="Faltas" />
    <!-- O padrão atual e o legado da Apple: iOS antigo só entende o segundo,
         e é ele que faz o app abrir sem a barra do Safari. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent deixa o conteúdo subir até o notch; o padding vem
         do env(safe-area-inset-top) que as telas já aplicam. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Controle de Faltas</title>

    <!--
      Tema aplicado antes do primeiro paint. Sem isto, o app pisca no tema
      errado a cada carregamento — o defeito mais visível de qualquer app com
      dark mode. Roda síncrono de propósito.
    -->
    <script>
      ;(function () {
        try {
          var modo = localStorage.getItem('cf:modo') || 'system'
          var tema = localStorage.getItem('cf:tema') || 'fogo'
          var densidade = localStorage.getItem('cf:densidade') || 'confortavel'
          var escuro =
            modo === 'dark' ||
            (modo === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var raiz = document.documentElement
          raiz.dataset.modo = escuro ? 'dark' : 'light'
          raiz.dataset.tema = tema
          raiz.dataset.densidade = densidade
          raiz.style.colorScheme = escuro ? 'dark' : 'light'
        } catch (e) {
          /* localStorage bloqueado: fica no padrão do HTML */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
