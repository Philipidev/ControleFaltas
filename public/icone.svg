<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Controle de Faltas">
  <!-- O medidor de risco é a imagem central do app, então é ele que vira o
       ícone: uma trilha com o preenchimento parando pouco antes da marca do
       limite. Legível a 16px porque são só duas formas. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#fundo)" />

  <!-- trilha -->
  <rect x="88" y="228" width="336" height="56" rx="28" fill="#ffffff" opacity="0.32" />
  <!-- preenchimento -->
  <rect x="88" y="228" width="212" height="56" rx="28" fill="#ffffff" />
  <!-- marca do limite -->
  <rect x="348" y="212" width="10" height="88" rx="5" fill="#ffffff" opacity="0.85" />
</svg>
