<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Controle de Faltas">
  <!-- Versão maskable: o Android recorta o ícone em formas variadas (círculo,
       squircle, gota), cortando até 20% de cada borda. Por isso o fundo é
       sangrado até a borda e o desenho vive na zona segura central (~80%). -->
  <rect width="512" height="512" fill="#ea580c" />
  <rect x="128" y="236" width="256" height="40" rx="20" fill="#ffffff" opacity="0.34" />
  <rect x="128" y="236" width="160" height="40" rx="20" fill="#ffffff" />
  <rect x="320" y="224" width="9" height="64" rx="4.5" fill="#ffffff" opacity="0.85" />
</svg>
